<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AI Engineer Training — Digital Skola × Microsoft Azure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1442"/>
      <stop offset="0.55" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0063B1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <!-- neural network motif -->
  <g opacity="0.55" stroke="#50E6FF" stroke-width="1.4">
    <line x1="900" y1="70"  x2="1000" y2="120"/><line x1="900" y1="70"  x2="1000" y2="200"/>
    <line x1="900" y1="160" x2="1000" y2="120"/><line x1="900" y1="160" x2="1000" y2="200"/>
    <line x1="900" y1="250" x2="1000" y2="120"/><line x1="900" y1="250" x2="1000" y2="200"/>
    <line x1="1000" y1="120" x2="1100" y2="160"/><line x1="1000" y1="200" x2="1100" y2="160"/>
    <line x1="900" y1="70" x2="900" y2="160" opacity="0.4"/><line x1="900" y1="160" x2="900" y2="250" opacity="0.4"/>
  </g>
  <g fill="#0B1442" stroke="#50E6FF" stroke-width="2.5">
    <circle cx="900" cy="70" r="11"/><circle cx="900" cy="160" r="11"/><circle cx="900" cy="250" r="11"/>
    <circle cx="1000" cy="120" r="13"/><circle cx="1000" cy="200" r="13"/>
  </g>
  <circle cx="1100" cy="160" r="17" fill="#50E6FF"/>
  <circle cx="1100" cy="160" r="28" fill="none" stroke="#50E6FF" stroke-width="1.5" opacity="0.4"/>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="64" y="58" width="236" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="182" y="80" text-anchor="middle" fill="#CFE8FF" font-size="15" font-weight="600" letter-spacing="1.5">BOOTCAMP · 2026</text>

    <text x="64" y="158" fill="#FFFFFF" font-size="62" font-weight="800">AI Engineer Training</text>
    <rect x="66" y="176" width="150" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="222" fill="#CFE8FF" font-size="28" font-weight="600">Digital Skola  ×  Microsoft Azure</text>
    <text x="64" y="266" fill="#FFFFFF" fill-opacity="0.72" font-size="18">23 Sesi · 4 Proyek · Final Project · Mock Exam AI-901</text>
  </g>
</svg>
